name: Deploy Frontend Production

on:
  push:
    branches:
      - main
    paths:
      - "ruangsinyal-fe/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Build frontend artifact and deploy
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || secrets.USERNAME }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || secrets.PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT || secrets.SERVER_PORT || '22' }}
      BACKEND_RELEASE_DIR: ${{ secrets.BACKEND_RELEASE_DIR || '/var/lib/syslog-ng/ruangsinyal/releases/ruangsinyal-be/current' }}
      FRONTEND_RELEASE_DIR: ${{ secrets.FRONTEND_RELEASE_DIR || '/var/lib/syslog-ng/ruangsinyal/releases/ruangsinyal-fe/current' }}
      BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME || 'ruangsinyal-be.service' }}
      FRONTEND_SERVICE_NAME: ${{ secrets.FRONTEND_SERVICE_NAME || 'ruangsinyal-fe.service' }}
      FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" || (echo "SERVER_HOST secret is required" && exit 1)
          test -n "$SERVER_USER" || (echo "SERVER_USER secret is required" && exit 1)
          test -n "$SERVER_PASSWORD" || (echo "SERVER_PASSWORD secret is required" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ruangsinyal-fe/package-lock.json

      - name: Install dependencies
        working-directory: ruangsinyal-fe
        shell: bash
        run: npm ci

      - name: Write build environment
        working-directory: ruangsinyal-fe
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$FRONTEND_ENV" ]]; then
            printf '%s\n' "$FRONTEND_ENV" > .env.production
          fi

      - name: Build standalone frontend
        working-directory: ruangsinyal-fe
        shell: bash
        run: npm run build

      - name: Package frontend release
        working-directory: ruangsinyal-fe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/.next release/public
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          if [[ -d public ]]; then
            cp -a public/. release/public/
          fi
          if [[ -f .env.production ]]; then
            cp .env.production release/.env
          fi
          tar -C release -czf ../ruangsinyal-fe-release.tar.gz .

      - name: Install deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/disabled-apt-sources
          for source_file in $(sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d 2>/dev/null || true); do
            sudo mv "$source_file" "/tmp/disabled-apt-sources/$(basename "$source_file").disabled"
          done
          sudo sed -i '/dl.google.com\/linux\/chrome/s/^[[:space:]]*deb /# deb /' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y sshpass

      - name: Prepare SSH connection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e scp -P "$SSH_PORT" ruangsinyal-fe-release.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/ruangsinyal-fe-release.tar.gz"

      - name: Publish frontend release
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "FRONTEND_RELEASE_DIR='$FRONTEND_RELEASE_DIR' GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$(basename "$FRONTEND_RELEASE_DIR")" != "current" ]; then
            echo "FRONTEND_RELEASE_DIR harus berakhir dengan /current: $FRONTEND_RELEASE_DIR" >&2
            exit 1
          fi
          RELEASE_ROOT="$(dirname "$FRONTEND_RELEASE_DIR")"
          BUILD_DIR="$RELEASE_ROOT/build-${GITHUB_SHA:0:7}-$(date +%Y%m%d%H%M%S)"
          TMP_LINK="$RELEASE_ROOT/.current-tmp"

          test -f /tmp/ruangsinyal-fe-release.tar.gz
          install -d "$BUILD_DIR"
          tar -xzf /tmp/ruangsinyal-fe-release.tar.gz -C "$BUILD_DIR"
          rm -f /tmp/ruangsinyal-fe-release.tar.gz

          if [ ! -f "$BUILD_DIR/.env" ] && [ -f "$FRONTEND_RELEASE_DIR/.env" ]; then
            cp "$FRONTEND_RELEASE_DIR/.env" "$BUILD_DIR/.env"
          fi
          if [ ! -f "$BUILD_DIR/server.js" ]; then
            SERVER_ENTRY="$(find "$BUILD_DIR" -maxdepth 4 -name server.js | head -n 1)"
            test -n "$SERVER_ENTRY" || (echo "server.js tidak ditemukan di artifact frontend" >&2 && exit 1)
            ln -s "${SERVER_ENTRY#$BUILD_DIR/}" "$BUILD_DIR/server.js"
          fi

          if [ -e "$FRONTEND_RELEASE_DIR" ] && [ ! -L "$FRONTEND_RELEASE_DIR" ]; then
            mv "$FRONTEND_RELEASE_DIR" "$RELEASE_ROOT/current-backup-$(date +%Y%m%d%H%M%S)"
          fi
          ln -sfn "$BUILD_DIR" "$TMP_LINK"
          mv -Tf "$TMP_LINK" "$FRONTEND_RELEASE_DIR"
          CURRENT_BUILD="$(readlink -f "$FRONTEND_RELEASE_DIR")"
          find "$RELEASE_ROOT" -maxdepth 1 -mindepth 1 -type d -name "build-*" -printf "%T@ %p\n" | sort -nr | tail -n +4 | while IFS= read -r entry; do
            build="${entry#* }"
            [ "$build" = "$CURRENT_BUILD" ] || rm -rf -- "$build"
          done
          REMOTE

      - name: Restart RuangSinyal frontend and Nginx
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SERVER_PASSWORD"
          printf '%s\n' "$SERVER_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "sudo -S -p '' bash -c '
              set -euo pipefail
              install -d /etc/systemd/system/$FRONTEND_SERVICE_NAME.d
              printf \"%s\\n\" \"[Service]\" \"WorkingDirectory=$FRONTEND_RELEASE_DIR\" \"Environment=PORT=3000\" \"Environment=HOSTNAME=127.0.0.1\" \"ExecStart=\" \"ExecStart=/usr/bin/env node $FRONTEND_RELEASE_DIR/server.js\" > /etc/systemd/system/$FRONTEND_SERVICE_NAME.d/release.conf
              systemctl daemon-reload
              nginx -t
              if ! systemctl restart $FRONTEND_SERVICE_NAME nginx || ! systemctl is-active --quiet $FRONTEND_SERVICE_NAME nginx; then
                journalctl -u $FRONTEND_SERVICE_NAME -n 120 --no-pager || true
                systemctl --no-pager --full status $FRONTEND_SERVICE_NAME nginx || true
                exit 1
              fi
            '"
          sshpass -e ssh -p "$SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "for attempt in \$(seq 1 60); do
               if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
                 echo 'RuangSinyal frontend siap.'
                 exit 0
               fi
               sleep 2
             done
             echo 'Frontend belum siap setelah 120 detik.' >&2
             systemctl --no-pager --full status '$FRONTEND_SERVICE_NAME' || true
             exit 1"
